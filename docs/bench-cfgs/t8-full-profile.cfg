# TRIP 8 - the whole speed picture in one run.  (about 12 minutes, disc in the drive)
# Everything that decides how long a rip takes, measured in one boot so the numbers are
# comparable: the drive at four radii, the SD card at three command sizes, the hashes
# (including the CRC16 candidates), and the real capture engine at the four settings
# combinations that matter. Run it before and after any change and compare.
#
# Feed the saved report to the PC tool for whole-disc times in minutes:
#   python3 tools/rip_time.py /path/to/diagnostics.txt
# It prints the measured rate of any real capture in the file, a projected whole-disc time
# for every setting, and what the not-yet-built changes would be worth.
#
# Reference, measured 2026-09-20 on Sword of the Berserk (evidence/t7-real-capture...json):
# a whole disc took 26.7 minutes at ui_hz=2, capture_hash=crc32, end_readback=off.

ui_hz=2
sections=optical,hash,sd,sweep,capture

optical_fad=45150
optical_sectors=4096
sweep_fads=45150,150000,300000,450000
sweep_chunks=32
sweep_sectors=2048
sweep_verify=on

chunks=32,128,512
sd_mib=8
expand=off
sd_if=scif
sd_crc=on
hash_mib=8

capture_fad=45150
capture_sectors=4096
capture_type=data
capture_hash=both,crc32
end_readback=on,off
resume_check=full

note=T8 full profile. card=<model> disc=<title>
