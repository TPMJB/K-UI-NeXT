name: Diagnostic build

on:
  push:
    branches: [main, 'milestone/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: diagnostic-${{ github.ref }}
  # Let the first expensive compiler build finish and save its cache. New
  # revisions queue behind it and reuse that cache.
  cancel-in-progress: false

jobs:
  host:
    # Milestone branches already build on push. Avoid compiling the entire
    # toolchain again when the same branch is opened as a draft PR.
    if: github.event_name != 'pull_request' || !startsWith(github.head_ref, 'milestone/') || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install filesystem test utilities
        run: sudo apt-get update && sudo apt-get install -y dosfstools exfatprogs mtools
      - name: Restore pinned FatFs downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/downloads
          key: fatfs-downloads-v1-${{ hashFiles('dependencies.json') }}
      - name: Fetch verified FatFs sources
        run: python3 tools/fetch_deps.py --fatfs-only
      - name: Run portable and real filesystem checks
        run: make test test-images

  dreamcast:
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget patch python3 \
            bison flex texinfo gettext libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            meson ninja-build pkg-config libisofs-dev libpng-dev libjpeg-dev
      - name: Restore pinned FatFs downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/downloads
          key: fatfs-downloads-v1-${{ hashFiles('dependencies.json') }}
      - name: Restore toolchain and source downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/sh-elf
            .deps/kos/utils/kos-chain/*.tar.*
          key: sh-elf-ubuntu24-v1-${{ hashFiles('dependencies.json', 'tools/setup_kos.sh') }}
      - name: Build pinned toolchain and KOS
        run: bash tools/setup_kos.sh
      - name: Compile CD bootstrap and SD runtime
        shell: bash
        run: |
          source .deps/kos/environ.sh
          # -k: keep compiling after a failure, so ONE run lists every file the pinned compiler
          # rejects instead of stopping at the first (each extra error used to cost a round trip).
          # A failed compile still fails the job; nothing changes when the build succeeds.
          make -k diagnostic BUILD_ID="${GITHUB_SHA:0:12}"
      - name: Package reusable CDI, SD runtime, loader tests and source records
        shell: bash
        run: |
          source .deps/kos/environ.sh
          python3 tools/package.py
      - name: Upload diagnostic test artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: diagnostic
          path: dist/
          if-no-files-found: error
          retention-days: 30
      - name: Upload small SD update for existing bootstrap discs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: sd-update
          path: dist/sd-update/
          if-no-files-found: error
          retention-days: 30
