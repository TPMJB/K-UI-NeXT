name: Updater checks

on:
  pull_request:
    paths:
      - '.github/workflows/updater.yml'
      - 'Makefile'
      - 'Makefile.dc'
      - 'dependencies.json'
      - 'config/**'
      - 'include/kui/update*'
      - 'include/kui/boot*'
      - 'include/kui/runtime.h'
      - 'include/kui/storage_policy.h'
      - 'include/kui/shell.h'
      - 'src/core/update*'
      - 'src/core/boot*'
      - 'src/core/runtime*'
      - 'src/core/storage_policy.c'
      - 'src/core/shell.c'
      - 'src/dreamcast/bootstrap.c'
      - 'src/dreamcast/main.c'
      - 'src/dreamcast/platform.h'
      - 'src/dreamcast/shell_draw.c'
      - 'src/apps/*updat*'
      - 'tests/*updat*'
      - 'tests/test_shell.c'
      - 'tools/update*.py'
      - 'tools/fetch_deps.py'
      - 'tools/setup_kos.sh'
      - 'tools/runtime_package.py'
      - 'tools/record_build.py'
  push:
    branches: [main]
    paths:
      - '.github/workflows/updater.yml'
      - 'Makefile'
      - 'Makefile.dc'
      - 'dependencies.json'
      - 'config/**'
      - 'include/kui/update*'
      - 'include/kui/boot*'
      - 'include/kui/runtime.h'
      - 'include/kui/storage_policy.h'
      - 'include/kui/shell.h'
      - 'src/core/update*'
      - 'src/core/boot*'
      - 'src/core/runtime*'
      - 'src/core/storage_policy.c'
      - 'src/core/shell.c'
      - 'src/dreamcast/bootstrap.c'
      - 'src/dreamcast/main.c'
      - 'src/dreamcast/platform.h'
      - 'src/dreamcast/shell_draw.c'
      - 'src/apps/*updat*'
      - 'tests/*updat*'
      - 'tests/test_shell.c'
      - 'tools/update*.py'
      - 'tools/fetch_deps.py'
      - 'tools/setup_kos.sh'
      - 'tools/runtime_package.py'
      - 'tools/record_build.py'
  workflow_dispatch:

permissions:
  contents: read

# Let a cold compiler build finish and populate its cache before a later
# revision starts. This workflow is independent of the broad diagnostic suite.
concurrency:
  group: updater-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Restore pinned FatFs downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/downloads
          key: fatfs-downloads-v1-${{ hashFiles('dependencies.json') }}
      - name: Fetch verified FatFs sources
        run: python3 tools/fetch_deps.py --fatfs-only
      - name: Check update transactions, packages and shell integration
        shell: bash
        run: |
          set -euo pipefail
          {
            make -j2 test-updater build/test-shell
            ASAN_OPTIONS=detect_leaks=0 ./build/test-shell
          } 2>&1 | tee "${RUNNER_TEMP}/updater-host.log"
      - name: Retain focused host evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-host-${{ github.event.pull_request.head.sha || github.sha }}
          path: ${{ runner.temp }}/updater-host.log
          if-no-files-found: ignore
          retention-days: 14

  native:
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install pinned-toolchain build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget patch python3 \
            bison flex texinfo gettext libgmp-dev libmpfr-dev libmpc-dev libisl-dev
      - name: Restore pinned FatFs downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/downloads
          key: fatfs-downloads-v1-${{ hashFiles('dependencies.json') }}
      - name: Restore compiler and source downloads
        id: compiler-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/sh-elf
            .deps/kos/utils/kos-chain/*.tar.*
          key: sh-elf-ubuntu24-v1-${{ hashFiles('dependencies.json', 'tools/setup_kos.sh') }}
          restore-keys: sh-elf-ubuntu24-v1-
      - name: Prepare pinned compiler and KOS
        run: bash tools/setup_kos.sh
      # Save immediately: an application compile failure must not discard an
      # otherwise completed compiler and force the next run to rebuild it.
      - name: Save completed compiler cache
        if: steps.compiler-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/sh-elf
            .deps/kos/utils/kos-chain/*.tar.*
          key: ${{ steps.compiler-cache.outputs.cache-primary-key }}
      - name: Compile GUI and CD bootstrap, and validate the runtime
        shell: bash
        run: |
          set -eo pipefail
          source .deps/kos/environ.sh
          set -u
          build_id="$(git rev-parse --short=12 HEAD)"
          {
            make -f Makefile.dc -j2 build/kui-runtime.elf build/kui-diagnostic.elf BUILD_ID="$build_id"
            python3 tools/runtime_package.py build build/kui-runtime.elf build/runtime.kui --build-id "$build_id"
            python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys
          sys.path.insert(0, 'tools')
          from package import storage_image
          from runtime_package import flatten_elf
          from update_package import CAPABILITY, HANDOFF_HEADER, handoff_empty
          build = subprocess.check_output(['git', 'rev-parse', '--short=12', 'HEAD'], text=True).strip()
          for name, expected in (('runtime', 1), ('diagnostic', 0)):
              elf = Path('build/kui-' + name + '.elf').read_bytes()
              storage_image(elf, build, name)
              payload, _ = flatten_elf(elf)
              if payload.count(CAPABILITY) != expected:
                  raise SystemExit(name + ': unexpected immutable-bank capability count')
              if (expected and not handoff_empty(payload)) or (not expected and HANDOFF_HEADER in payload):
                  raise SystemExit(name + ': unexpected update handoff slot')
          print('PASS native envelopes, unique storage handoffs, GUI bank capability and unchanged CD contract')
          PY
          } 2>&1 | tee "${RUNNER_TEMP}/updater-native.log"
      - name: Retain native compile evidence
        # These are GUI/bootstrap build checks, not a complete update cohort.
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: updater-native-build-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            ${{ runner.temp }}/updater-native.log
            build/kui-runtime.elf
            build/kui-runtime.map
            build/kui-runtime.compile.json
            build/runtime.kui
            build/kui-diagnostic.elf
            build/kui-diagnostic.map
            build/kui-diagnostic.compile.json
          if-no-files-found: warn
          retention-days: 14
