name: Compressed reader candidate
on:
  push:
    branches: [feature/native-cso-chd]
permissions:
  contents: read
concurrency:
  group: compressed-${{ github.ref }}
  cancel-in-progress: true
jobs:
  detached:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget patch python3 bison flex texinfo gettext libgmp-dev libmpfr-dev libmpc-dev libisl-dev libpng-dev libjpeg-dev meson ninja-build pkg-config libisofs-dev ffmpeg dosfstools exfatprogs
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .deps/sh-elf
            .deps/kos/utils/kos-chain/*.tar.*
          key: sh-elf-ubuntu24-v1-${{ hashFiles('dependencies.json', 'tools/setup_kos.sh') }}
          restore-keys: sh-elf-ubuntu24-v1-
      - name: Build pinned toolchain and KOS
        run: bash tools/setup_kos.sh
      - name: Build and audit native compressed readers
        shell: bash
        run: |
          source .deps/kos/environ.sh
          make -f Makefile.dc native-cso native-zso native-lzo BUILD_ID="$(git rev-parse --short=12 HEAD)"
      - name: Compile complete matching application and readers
        shell: bash
        run: |
          source .deps/kos/environ.sh
          make diagnostic BUILD_ID="$(git rev-parse --short=12 HEAD)"
      - name: Package the complete candidate
        shell: bash
        env:
          KUI_RELEASE_CANDIDATE: '1'
          KUI_CANDIDATE_PROFILE: compressed
        run: |
          source .deps/kos/environ.sh
          python3 tools/package.py
      - name: Retain matching SD test update
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compressed-sd-update
          path: dist/sd-update/
          if-no-files-found: error
      - name: Retain detached build evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: compressed-reader-evidence
          path: |
            build/retail-cso
            build/retail-zso
            build/retail-lzo
