name: Experimental VMU prototype

on:
  push:
    branches: ['milestone/vmu-*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vmu-${{ github.ref }}
  cancel-in-progress: false

jobs:
  host:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install filesystem test tools
        run: sudo apt-get update && sudo apt-get install -y dosfstools exfatprogs python3-yaml
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/downloads
          key: fatfs-downloads-v1-${{ hashFiles('dependencies.json') }}
      - run: python3 tools/fetch_deps.py --fatfs-only
      - name: Verify protocol, persistence, DMA filtering and exclusive SD transport
        run: make -j2 test-vmu-prototype
      - name: Exercise exact harness through real FAT32 and exFAT
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: |
          make -f Makefile.vmu host-test
          python3 tests/test_vmu_harness_images.py
      - name: Verify workflow hygiene
        run: python3 tests/test_workflow_hygiene.py
  dreamcast:
    needs: host
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential git curl wget patch python3 \
            bison flex texinfo gettext libgmp-dev libmpfr-dev libmpc-dev libisl-dev \
            meson ninja-build pkg-config libisofs-dev libpng-dev libjpeg-dev ffmpeg
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: .deps/downloads
          key: fatfs-downloads-v1-${{ hashFiles('dependencies.json') }}
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            .deps/sh-elf
            .deps/kos/utils/kos-chain/*.tar.*
          key: sh-elf-ubuntu24-v1-${{ hashFiles('dependencies.json', 'tools/setup_kos.sh') }}
          restore-keys: sh-elf-ubuntu24-v1-
      - run: bash tools/setup_kos.sh
      - name: Build standalone console harness and experimental transport objects
        shell: bash
        run: |
          source .deps/kos/environ.sh
          make -f Makefile.vmu -j2 package
          mkdir -p build/vmu-harness/transport
          for unit in src/loader/vmu_backing.c src/loader/sci_sd_bus.c src/loader/sd_reader.c src/dreamcast/sci_sd_storage.c; do
            kos-cc -std=c11 -Os -Wall -Wextra -Werror -ffreestanding -fno-builtin -fstack-usage \
              -Iinclude -Isrc/loader -Isrc/dreamcast -DKUI_RETAIL_TRANSPORT=1 -DKUI_VMU_EXPERIMENTAL=1 \
              -c "$unit" -o "build/vmu-harness/transport/$(basename "$unit" .c).o"
          done
          sh-elf-size build/vmu-harness/vmu-harness.elf build/vmu-harness/transport/*.o
          sh-elf-objdump -d build/vmu-harness/vmu-harness.elf > build/vmu-harness/vmu-harness.dis
      - name: Assemble console test files
        run: |
          mkdir -p build/vmu-harness/package/KUI
          cp build/vmu-harness/KUI/tools.kui build/vmu-harness/package/KUI/
          cp docs/vmu-harness-test.md build/vmu-harness/package/README.md
          cp docs/vmu-protocol.md docs/vmu-store.md docs/vmu-maple-interception.md docs/vmu-runtime-design.md build/vmu-harness/package/
          git rev-parse HEAD > build/vmu-harness/package/SOURCE-COMMIT.txt
          sha256sum build/vmu-harness/package/KUI/tools.kui > build/vmu-harness/package/SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: K-UI-experimental-VMU-console-test
          path: build/vmu-harness/package/
          if-no-files-found: error
          retention-days: 30
      - name: Retain native proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: K-UI-experimental-VMU-native-proof
          path: |
            build/vmu-harness/*.elf
            build/vmu-harness/*.map
            build/vmu-harness/*.json
            build/vmu-harness/*.dis
            build/vmu-harness/**/*.su
            build/vmu-harness/transport/
          if-no-files-found: ignore
          retention-days: 30
