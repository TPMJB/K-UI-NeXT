<title>CN503 contact alignment trial 01</title>
<desc>Actual-size contact guide with provisional 1 mm pitch and 5.03 mm trial row-center spacing. Check the 20 mm scale bars. This is not an electrical pinout or manufacturing footprint.</desc>
