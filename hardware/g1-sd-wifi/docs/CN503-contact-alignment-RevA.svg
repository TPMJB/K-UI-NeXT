<text x="18" y="28" font-family="Helvetica,Arial,sans-serif" font-size="3.4" font-weight="400" fill="#111111">Dreamcast VA1 | owner measurements, 9 October 2026</text>
<text x="18" y="36" font-family="Helvetica,Arial,sans-serif" font-size="3.3" font-weight="700" fill="#111111">Print at actual size / 100%. Disable fit-to-page. Check BOTH 20 mm scale bars.</text>
<text x="18" y="43" font-family="Helvetica,Arial,sans-serif" font-size="3.2" font-weight="400" fill="#111111">Alignment guide only. Electrical pin numbering and a manufacturing footprint are not shown.</text>
