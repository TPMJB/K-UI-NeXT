<text x="82" y="70" font-family="Helvetica,Arial,sans-serif" font-size="3.8" font-weight="700" fill="#111111">Working geometry</text>
<text x="82" y="78" font-family="Helvetica,Arial,sans-serif" font-size="3.3" font-weight="400" fill="#111111">25 contacts per row; 1.00 mm pitch</text>
<text x="82" y="85" font-family="Helvetica,Arial,sans-serif" font-size="3.3" font-weight="700" fill="#111111">5.03 mm BETWEEN TRIAL ROW CENTERS</text>
<text x="82" y="92" font-family="Helvetica,Arial,sans-serif" font-size="3.3" font-weight="400" fill="#111111">Approx. 0.44 mm contact width along row</text>
<text x="82" y="99" font-family="Helvetica,Arial,sans-serif" font-size="3.3" font-weight="400" fill="#111111">24.00 mm center span (calculated)</text>
<text x="82" y="106" font-family="Helvetica,Arial,sans-serif" font-size="3.3" font-weight="400" fill="#111111">24.44 mm outside span (calculated)</text>
<text x="18" y="121" font-family="Helvetica,Arial,sans-serif" font-size="3.2" font-weight="400" fill="#111111">Black ticks show contact centers and width; tick length is symbolic, not measured tail length.</text>
<text x="18" y="128" font-family="Helvetica,Arial,sans-serif" font-size="3.2" font-weight="400" fill="#111111">Dashed rectangle: 38.67 x 6.56 mm maximum housing envelope only, not a cutout.</text>
<text x="18" y="135" font-family="Helvetica,Arial,sans-serif" font-size="3.2" font-weight="400" fill="#111111">The narrower-section width was reported as the approximate 5.03 mm row separation.</text>
<text x="18" y="142" font-family="Helvetica,Arial,sans-serif" font-size="3.2" font-weight="700" fill="#111111">This drawing uses that value AS center spacing for a fit check; verify alignment of both rows.</text>
<text x="18" y="151" font-family="Helvetica,Arial,sans-serif" font-size="3.8" font-weight="700" fill="#111111">How to check</text>
<text x="18" y="159" font-family="Helvetica,Arial,sans-serif" font-size="3.3" font-weight="400" fill="#111111">1. Verify that both scale bars below measure 20 mm on the printed sheet.</text>
<text x="18" y="166" font-family="Helvetica,Arial,sans-serif" font-size="3.3" font-weight="400" fill="#111111">2. Compare one trial row with all 25 contacts, then compare the other row.</text>
<text x="18" y="173" font-family="Helvetica,Arial,sans-serif" font-size="3.3" font-weight="400" fill="#111111">3. Check that both rows align together. Keep the paper clear of the connector housing.</text>
<text x="18" y="180" font-family="Helvetica,Arial,sans-serif" font-size="3.3" font-weight="400" fill="#111111">   If the housing prevents a flat overlay, compare separate row strips and their marked spacing.</text>
<text x="18" y="189" font-family="Helvetica,Arial,sans-serif" font-size="3.8" font-weight="700" fill="#111111">Working owner data</text>
<text x="18" y="197" font-family="Helvetica,Arial,sans-serif" font-size="3.3" font-weight="400" fill="#111111">Pin run: 24.39 mm; contact width: about 0.44 mm; BIOS-to-CN503 gap: about 12 mm.</text>
<text x="18" y="204" font-family="Helvetica,Arial,sans-serif" font-size="3.3" font-weight="400" fill="#111111">CN503 tails: essentially at motherboard surface. BIOS body: about 2 mm above it.</text>
<text x="18" y="211" font-family="Helvetica,Arial,sans-serif" font-size="3.2" font-weight="400" fill="#111111">Flex pad overlap, exposed tail length, coverlay, solder access and tolerances remain to be designed.</text>
