<text x="104" y="240" font-family="Helvetica,Arial,sans-serif" font-size="3.3" font-weight="700" fill="#111111">20 mm - vertical</text>
<text x="18" y="269" font-family="Helvetica,Arial,sans-serif" font-size="3.2" font-weight="400" fill="#111111">K-UI G1 bridge proposal | no pin orientation or connector A/B row assignment is implied.</text>
